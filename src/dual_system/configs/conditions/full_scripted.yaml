# Pipeline check without a VLM: same supervisor and triggers as full, scripted answers. Exercises a command change.
system2:
  type: supervisor
  recovery_steps: 10
  min_verdict_step: 10
  reasoner:
    type: scripted
    check_answers:
      - {step: done, task: running}
      - {step: done, task: running}
      - {step: running, task: running}
  knowledge: {type: static, profile: closed_set}
triggers:
  min_gap: 5
  enabled:
    periodic: {every_steps: 10}
    gripper_toggle: {debounce: 3}
    quiescence: {window: 20}
    empty_grasp: {width_m: 0.004}
    subgoal_timeout: {steps: 300}
interface: {type: identity}
