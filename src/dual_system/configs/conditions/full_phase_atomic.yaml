# Same backbone as full_free_atomic, but System 2 knows the phases, their finish conditions and where it is, reasons
# briefly and ends with the current subtask. The sub-goal timeout is half of the 300-step limit, so recovery can still run.
system2:
  type: phase_supervisor
  gate: true
  decompose: true
  recover: true
  judge: true
  confirmations: 2
  max_retries: 2
  recovery_steps: 40
  min_verdict_step: 40
  reasoner: {type: qwen, model: Qwen/Qwen3-VL-2B-Instruct, device: cuda, dtype: float16}
  knowledge: {type: static, profile: phase_atomic}
triggers:
  min_gap: 5
  enabled:
    periodic: {every_steps: 20}   # 1 s of sim time
    gripper_toggle: {debounce: 3}
    quiescence: {window: 20}
    empty_grasp: {width_m: 0.004}
    subgoal_timeout: {steps: 150}
interface: {type: identity}
