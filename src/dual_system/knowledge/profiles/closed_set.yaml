# System 2 picks from sentences in LIBERO phrasing. Candidates are task-specific, so this profile helps System 2
# with vocabulary and step granularity: report that when interpreting results. It still has to choose and order them.
name: closed_set
rules:
  - Every command is one short imperative sentence, copied word for word from the candidate list.
  - Use as few commands as possible. If one candidate already covers the whole instruction and it needs no split, use only that one.
examples:
  - 'Instruction "put the cup and the plate in the box" with candidates ["put the plate in the box", "put the cup in the box", "put the cup and the plate in the box"] gives steps ["put the cup in the box", "put the plate in the box"].'
recovery_commands:
  - open the gripper
  - move back to the home position
tasks:
  # libero_goal: same scene, one action each. Other goals of the scene are the distractors.
  - instruction: open the middle drawer of the cabinet
    candidates: [put the bowl on the stove, turn on the stove, open the middle drawer of the cabinet]
  - instruction: put the bowl on the stove
    candidates: [turn on the stove, put the bowl on the stove, put the bowl on the plate]
  - instruction: put the bowl on top of the cabinet
    candidates: [put the bowl on the plate, open the middle drawer of the cabinet, put the bowl on top of the cabinet]
  - instruction: turn on the stove
    candidates: [put the bowl on the stove, turn on the stove, open the middle drawer of the cabinet]
  - instruction: put the bowl on the plate
    candidates: [put the bowl on the stove, put the bowl on the plate, put the bowl on top of the cabinet]
  # libero_10: compound instructions.
  - instruction: put both the alphabet soup and the tomato sauce in the basket
    candidates: [put the tomato sauce in the basket, put the alphabet soup in the basket, put both the alphabet soup and the tomato sauce in the basket]
  - instruction: turn on the stove and put the moka pot on it
    candidates: [put the moka pot on the stove, turn on the stove, turn on the stove and put the moka pot on it]
  - instruction: put the black bowl in the bottom drawer of the cabinet and close it
    candidates: [close the bottom drawer of the cabinet, put the black bowl in the bottom drawer of the cabinet, put the black bowl in the bottom drawer of the cabinet and close it]
  - instruction: pick up the book and place it in the back compartment of the caddy
    candidates: [place the book in the back compartment of the caddy, pick up the book, pick up the book and place it in the back compartment of the caddy]
  - instruction: put both moka pots on the stove
    candidates: [turn on the stove, put the second moka pot on the stove, put the first moka pot on the stove, put both moka pots on the stove]
