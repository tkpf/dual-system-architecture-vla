# Subtasks of the 40 LIBERO tasks in lerobot/libero. Each group belongs to one BDDL goal predicate, found by the text in
# `goal`. Groups are ordered per demo by when their goal is reached, because demos of "put both" tasks differ in order.
# Spatial tasks keep the bowl's position in the pick command, since identical bowls can only be told apart by it.

